services:
  app: &application
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:80"
    environment:
      - APP_ENV=${APP_ENV:-local}
      - APP_DEBUG=${APP_DEBUG:-true}
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-ojs_rpl}
      - DB_USERNAME=${DB_USERNAME:-ojs_rpl}
      - DB_PASSWORD=${DB_PASSWORD:-ojs_rpl_dev}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SESSION_DRIVER=redis
      - CACHE_STORE=redis
      - QUEUE_CONNECTION=database
      - FILE_SCAN_DRIVER=clamd
      - CLAMD_HOST=clamav
      - CLAMD_PORT=3310
      - MAIL_HOST=mailpit
      - MAIL_PORT=1025
      - FILESYSTEM_DISK=azure
      - AZURE_STORAGE_NAME=devstoreaccount1
      - AZURE_STORAGE_KEY=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==
      - AZURE_STORAGE_CONTAINER=sirida-manuscripts
      - AZURE_STORAGE_URL=http://azurite:10000/devstoreaccount1
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      azurite:
        condition: service_started


  worker:
    <<: *application
    ports: []
    command: ["php", "artisan", "queue:work", "database", "--queue=identity,notifications,imports,default", "--tries=3", "--timeout=120"]

  scan-worker:
    <<: *application
    ports: []
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy
    command: ["php", "artisan", "queue:work", "database", "--queue=file-security", "--tries=3", "--timeout=180"]

  scheduler:
    <<: *application
    ports: []
    command: ["php", "artisan", "schedule:work"]

  clamav:
    platform: linux/amd64
    mem_limit: 4g
    image: clamav/clamav@sha256:6d87c712e3391e13c1ba6e05dfb074d4b1ddb5a6834b23bb9da990d2a4ef042a
    restart: unless-stopped
    # Keep the unauthenticated clamd protocol inside the application network.
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-ojs_rpl}
      MYSQL_USER: ${DB_USERNAME:-ojs_rpl}
      MYSQL_PASSWORD: ${DB_PASSWORD:-ojs_rpl_dev}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_dev_password}
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u \"$$MYSQL_USER\" --password=\"$$MYSQL_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FORWARD_MAILPIT_PORT:-1025}:1025"
      - "127.0.0.1:${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025"

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${AZURITE_PORT:-10000}:10000"
    volumes:
      - azurite_data:/data
    command: azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --location /data

volumes:
  clamav_data:
  mysql_data:
  redis_data:
  azurite_data:
