extends:
  - recommended
rules:
  # Draft contract: production domains and the proprietary licence URL are not assigned.
  no-server-example.com: off
  info-license-strict: off
  # Health checks need no client error, and redirect operations correctly return 302.
  operation-4xx-response: off
  operation-2xx-response: off
  # Structural and example failures must stop CI, not merely produce warnings.
  no-ambiguous-paths: error
  no-invalid-media-type-examples: error
  no-invalid-schema-examples: error
  no-unresolved-refs: error
