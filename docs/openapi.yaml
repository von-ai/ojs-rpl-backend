      type: object
      additionalProperties: false
      required: [id, type, attributes]
      properties:
        id:
          $ref: "#/components/schemas/Identifier"
        type:
          type: string
          const: audit_log
        attributes:
          type: object
          additionalProperties: false
          required:
            - journal_id
            - actor_id
            - effective_role
            - action
            - resource_type
            - resource_id
            - request_id
            - occurred_at
            - actor_type
            - system_actor
          properties:
            journal_id:
              oneOf:
                - $ref: "#/components/schemas/Identifier"
                - type: "null"
            actor_id:
              oneOf:
                - $ref: "#/components/schemas/Identifier"
                - type: "null"
            effective_role:
              oneOf:
                - $ref: "#/components/schemas/Role"
                - type: "null"
            action:
              type: string
            resource_type:
              type: string
            resource_id:
              $ref: "#/components/schemas/Identifier"
            before:
              type: object
              additionalProperties: true
            after:
              type: object
              additionalProperties: true
            reason:
              type: string
            request_id:
              type: string
            occurred_at:
              $ref: "#/components/schemas/Timestamp"
            actor_type:
              type: string
              enum:
                - user
                - system
            system_actor:
              oneOf:
                - type: string
                  minLength: 1
                  maxLength: 100
                - type: "null"
          description: Append-only event. System-scope journal_id may be null; scheduled workers use
            actor_type=system, actor_id=null, effective_role=null and a named system_actor. Human events
            require actor_id/effective_role and system_actor=null. Scrub credentials, tokens, signed URLs and
            confidential manuscript/reviewer data from before/after.
          allOf:
            - if:
                type: object
                properties:
                  actor_type:
                    enum:
                      - system
                required:
                  - actor_type
                additionalProperties: true
              then:
                type: object
                properties:
                  actor_id:
                    type: "null"
                  effective_role:
                    type: "null"
                  system_actor:
                    type: string
                    minLength: 1
                required: []
                additionalProperties: true
            - if:
                type: object
                properties:
                  actor_type:
                    enum:
                      - user
                required:
                  - actor_type
                additionalProperties: true
              then:
                type: object
                properties:
                  actor_id:
                    $ref: "#/components/schemas/Identifier"
                  effective_role:
                    $ref: "#/components/schemas/Role"
                  system_actor:
                    type: "null"
                required: []
                additionalProperties: true
