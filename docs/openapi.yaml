openapi: 3.1.1
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base
info:
  title: BRIDA Scientific Journal Management API
  version: 1.0.0
  summary: REST API contract for the BRIDA journal editorial and publishing platform.
  description: |
    Contract-first API for a modular Laravel monolith covering authentication, RBAC,
    journal submissions, double-blind peer review, editorial decisions, production,
    issue publishing, notifications, audit logs, Crossref, ORCID, and OAI-PMH.

    All editorial resources are scoped by `journal_id`. Public resources expose only
    published projections. Private files are transferred through short-lived signed
    URLs and must pass asynchronous security scanning before workflow commands can
    reference them.

    Payment and APC processing are intentionally excluded from version 1 because the
    approved SRS classifies them as out of scope.

    Implementation status: planned contract. The Laravel application currently exposes
    only the scaffold routes; these domain endpoints are not implemented yet. See
    docs/use-cases.md for acceptance scenarios and docs/architecture.md for the selected
    stack, deployment prerequisites and explicit deviations from the original proposal.

    Journal authorization requires an active, verified account, journal membership
    and object ownership or assignment as well as the listed role. Every path/body/file
    identifier must belong to the same authorized journal and workflow. Global roles
    are separate from journal memberships; platform operations require a system role
    without requiring journal membership. A role alone never grants object access.

    Optimistic concurrency: x-concurrency-resource identifies the aggregate whose
    strong ETag must be obtained with GET and sent unchanged in If-Match. Command
    subresources share that aggregate version. A stale validator returns 412; a
    missing required validator returns 428; workflow conflicts return 409. Re-fetch
    the aggregate after a command. Never manufacture ETags from a version number.

    Version 1.0.0 is the final implementation baseline, not a deployed API. All operations
    remain planned. Read docs/contract-decisions.md for normative lifecycle rules,
    configurable policy and deployment prerequisites. HTTP errors use Problem;
    OAI-PMH validation errors use the OAI XML protocol.

    API bearer transport: use Authorization headers over HTTPS, never URL tokens.
    A same-origin server-rendered client may proxy this contract through its own
    HttpOnly/Secure/SameSite session and CSRF protection. The API does not accept
    ambient cookie authentication. Browser CORS must allow only configured origins
    and expose ETag, Location, Retry-After and X-Request-ID. Session refresh cannot
    extend session_max_minutes from initial login (configured maximum 24 hours).

    Merge PATCH semantics follow RFC 7396: omitted properties are unchanged; null
    removes only fields explicitly nullable in the patch schema. Reject removal of
    required stored fields and validate the complete merged representation. Read and
    list endpoints apply field-level visibility as well as object-level authorization.
  contact:
    name: BRIDA Journal Platform Team
  license:
    name: Proprietary
servers:
  - url: /
    description: Same-origin deployment; replace with the actual HTTPS origin in client configuration.
      No production hostname has been provisioned.
  - url: http://localhost:8000
    description: Local development only
tags:
  - name: Authentication
    description: Account registration, verification, sessions and password recovery.
  - name: ORCID
    description: Researcher identity linking through ORCID OAuth.
  - name: Public Catalog
    description: Published journal, issue and article projections.
  - name: Submissions
    description: Author submissions, revisions and workflow history.
  - name: Files
    description: Authorized file uploads, scanning and downloads.
  - name: Desk Review
    description: Initial editorial screening and editor assignments.
  - name: Peer Review
    description: Reviewer invitations, blind workspaces and evaluations.
  - name: Editorial Decisions
    description: Internal decisions and author-safe released feedback.
  - name: Production
    description: Copyediting, galley versions and proofreading approvals.
  - name: Issues
    description: Issue composition, scheduling and publication.
  - name: Users and Roles
    description: Journal memberships and scoped role administration.
  - name: Settings
    description: Journal and platform configuration.
  - name: Notifications
    description: Current-user notifications and event summaries.
  - name: Audit
    description: Sanitized append-only audit history.
  - name: Operations
    description: Authorized asynchronous job progress.
  - name: Crossref
    description: DOI XML deposits, status and retries.
  - name: OAI-PMH
    description: OAI-PMH 2.0 metadata harvesting.
  - name: Health
    description: Process liveness and dependency readiness.
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access JWT with a lifetime of at most 24 hours (NF-02). Refresh tokens rotate once per
        use; replay revokes the token family. Logout, password reset, account deactivation and role
        changes must revoke or re-evaluate affected sessions and permissions.
  headers:
    XRequestId:
      description: Correlation identifier for logs, audit records, and support.
      schema:
        type: string
    ETag:
      description: Opaque strong validator. Read it from the relevant GET response; never infer it from
        the version field.
      schema:
        type: string
        example: '"7"'
    RetryAfter:
      description: Seconds before the client should retry.
      schema:
        type: integer
        minimum: 1
    NoStore:
      description: Sensitive responses must not be stored by browsers or shared caches.
      schema:
        type: string
        const: no-store
    WwwAuthenticate:
      description: HTTP authentication challenge for bearer-protected resources.
      schema:
        type: string
        example: Bearer realm="sirida"
  parameters:
    JournalId:
      name: journal_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    JournalSlug:
      name: journal_slug
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
    PageSlug:
      name: page_slug
      in: path
      required: true
      description: Slug of a published page within the selected journal.
      schema:
        type: string
        pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        example: panduan-penulis
    SubmissionId:
      name: submission_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    RevisionId:
      name: revision_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    IssueId:
      name: issue_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    ArticleId:
      name: article_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    FileId:
      name: file_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    UploadId:
      name: upload_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    DeskReviewId:
      name: desk_review_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    ReviewRoundId:
      name: round_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    ReviewAssignmentId:
      name: assignment_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    DecisionId:
      name: decision_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    CopyeditId:
      name: copyedit_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    GalleyId:
      name: galley_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    ImportId:
      name: import_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    NotificationId:
      name: notification_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    OperationId:
      name: operation_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    CrossrefDepositId:
      name: deposit_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    SettingsVersionId:
      name: version_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    SearchQuery:
      name: q
      in: query
      schema:
        type: string
        minLength: 1
        maxLength: 200
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Unique client-generated key scoped to actor, journal and operation. Retain the request
        fingerprint and result for at least 24 hours. Reuse with a different payload returns 409. After
        authentication/authorization, replay an identical completed request before evaluating changed
        workflow versions; do not repeat side effects.
      schema:
        type: string
        minLength: 16
        maxLength: 255
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong ETag from GET of x-concurrency-resource. Stale validators return 412; missing
        validators return 428.
      schema:
        type: string
    IfMatchOptional:
      name: If-Match
      in: header
      required: false
      description: "Required when replacing an existing draft. For first creation, omit this header and
        send If-None-Match: * instead."
      schema:
        type: string
    IfNoneMatchCreate:
      name: If-None-Match
      in: header
      required: false
      description: Use * only for first creation of a review draft. Send exactly one of If-Match (replace)
        or If-None-Match (create).
      schema:
        type: string
        const: "*"
    SectionId:
      name: section_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    PageId:
      name: page_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    AnnouncementId:
      name: announcement_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    TemplateId:
      name: template_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    ExtensionId:
      name: extension_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    CheckId:
      name: check_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    CaseId:
      name: case_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    NoteId:
      name: note_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    EscalationId:
      name: escalation_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    Provider:
      name: provider
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    CandidateId:
      name: candidate_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
  responses:
    Accepted:
      description: Request accepted for asynchronous processing.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
    NoContent:
      description: Request completed with no response body.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
    BadRequest:
      description: Malformed or semantically invalid request.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Authentication is missing, invalid, expired, or revoked.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
        WWW-Authenticate:
          $ref: "#/components/headers/WwwAuthenticate"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://api.jurnal-brida.example/problems/unauthenticated
            title: Authentication required
            status: 401
            code: UNAUTHENTICATED
            detail: A valid access token is required.
            instance: /api/v1/me
            request_id: 01K5REQUEST00000000000001
            errors: []
    Forbidden:
      description: The current actor is not authorized for the operation or object.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
    NotFound:
      description: Resource was not found or is hidden by object-level authorization.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
    Conflict:
      description: Workflow state, idempotency or uniqueness conflict. An unsuccessful If-Match
        precondition returns 412 instead.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://api.jurnal-brida.example/problems/invalid-transition
            title: Invalid state transition
            status: 409
            code: SUBMISSION_INVALID_TRANSITION
            detail: Submission cannot move from under_review to published.
            instance: /api/v1/journals/01J/submissions/01S/submit
            request_id: 01K5REQUEST00000000000001
            errors: []
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
    Gone:
      description: A one-time token or upload session has expired.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
    ValidationError:
      description: One or more fields failed validation.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://api.jurnal-brida.example/problems/validation-failed
            title: Validation failed
            status: 422
            code: VALIDATION_FAILED
            detail: The request contains invalid fields.
            instance: /api/v1/auth/register
            request_id: 01K5REQUEST00000000000001
            errors:
              - field: email
                code: already_exists
                message: The email is already registered.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
    RateLimited:
      description: Rate limit exceeded.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unavailable:
      description: A required dependency is temporarily unavailable.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PreconditionFailed:
      description: The supplied conditional header does not match the current resource. Fetch the current
        representation before retrying.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
    PreconditionRequired:
      description: A required conditional header is missing. Fetch the relevant resource ETag before changing it.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
    UnsupportedMediaType:
      description: Unsupported request Content-Type.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PayloadTooLarge:
      description: Request exceeds the configured size limit.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InternalError:
      description: Unexpected server error. Return only a safe message and request ID; never a stack trace
        or secret.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Identifier:
      type: string
      minLength: 1
      maxLength: 64
      description: Opaque stable public identifier, intended to use a UUID/ULID mapping. Internal numeric
        database keys and storage paths are not public identifiers. Possession of an identifier grants no
        access.
      example: 01995e1c-f2b0-7a9c-8c9d-b065ea3dc8f1
    Timestamp:
      type: string
      format: date-time
      example: 2026-09-17T09:30:00Z
    ResourceMeta:
      type: object
      additionalProperties: false
      required: [request_id]
      properties:
        request_id:
          type: string
        pagination:
          $ref: "#/components/schemas/Pagination"
    Pagination:
      type: object
      additionalProperties: false
      required: [page, per_page, total, last_page]
      properties:
        page:
          type: integer
          minimum: 1
        per_page:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
        last_page:
          type: integer
          minimum: 1
    PaginationLinks:
      type: object
      additionalProperties: false
      required: [self]
      properties:
        self:
          type: string
          format: uri-reference
        next:
          oneOf:
            - type: string
              format: uri-reference
            - type: "null"
        prev:
          oneOf:
            - type: string
              format: uri-reference
            - type: "null"
    ValidationIssue:
      type: object
      additionalProperties: false
      required: [field, code, message]
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string
    Problem:
      type: object
      additionalProperties: false
      required:
        [type, title, status, code, detail, instance, request_id, errors]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          pattern: "^[A-Z][A-Z0-9_]+$"
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        request_id:
          type: string
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ValidationIssue"
    Role:
      oneOf:
        - $ref: "#/components/schemas/JournalRole"
        - $ref: "#/components/schemas/SystemRole"
    SubmissionStatus:
      type: string
      enum:
        - draft
        - submitted
        - incomplete
        - editorial_review
        - under_review
        - revision_required
        - resubmitted
        - accepted
        - rejected
        - copyediting
        - copyediting_complete
        - layout_draft
        - proofreading
        - layout_revision
        - proofread_approved
        - final_galley_review
        - ready_to_publish
        - scheduled
        - published
        - withdrawn
    SubmissionStage:
      type: string
      enum: [submission, review, copyediting, production, publishing, completed]
    ReviewRecommendation:
      type: string
      enum: [accept, minor_revision, major_revision, reject]
    ReviewAssignmentStatus:
      type: string
      enum:
        [
          invited,
          accepted,
          declined,
          no_response,
          overdue,
          completed,
          cancelled,
        ]
    FileStatus:
      type: string
      enum:
        [
          pending_upload,
          uploaded,
          pending_scan,
          clean,
          quarantined,
          rejected,
          deleted,
        ]
    FilePurpose:
      type: string
      enum:
        - primary_manuscript
        - supplementary_file
        - revision_manuscript
        - response_letter
        - reviewer_annotation
        - copyedited_manuscript
        - galley_draft
        - galley_final
        - user_import
        - ethics_evidence
    IssueStatus:
      type: string
      enum: [draft, scheduled, published]
    OperationStatus:
      type: string
      enum: [queued, running, succeeded, failed, cancelled]
    CrossrefDepositStatus:
      type: string
      enum: [pending, submitted, processing, succeeded, failed, retry_scheduled]
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, timestamp]
      properties:
        status:
          type: string
          enum: [ok, degraded, unavailable]
        timestamp:
          $ref: "#/components/schemas/Timestamp"
        checks:
          type: object
          additionalProperties:
            type: string
            enum: [ok, unavailable]

    RegisterRequest:
      type: object
      additionalProperties: false
      required:
        - full_name
        - email
        - username
        - password
        - affiliation
      properties:
        full_name:
          type: string
          minLength: 2
          maxLength: 200
        email:
          type: string
          format: email
        username:
          type: string
          pattern: "^[A-Za-z0-9_.-]{3,50}$"
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 128
          writeOnly: true
        affiliation:
          type: string
          minLength: 2
          maxLength: 255
    TokenRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          minLength: 20
          writeOnly: true
    EmailRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
    LoginRequest:
      type: object
      additionalProperties: false
      required: [login, password]
      properties:
        login:
          type: string
          description: Email address or username.
        password:
          type: string
          format: password
          writeOnly: true
    RefreshTokenRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          minLength: 32
          writeOnly: true
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required: [email, token, password, password_confirmation]
      properties:
        email:
          type: string
          format: email
        token:
          type: string
          writeOnly: true
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 128
          writeOnly: true
        password_confirmation:
          type: string
          format: password
          writeOnly: true
    AuthTokens:
      type: object
      additionalProperties: false
      required:
        [
          token_type,
          access_token,
          access_token_expires_at,
          refresh_token,
          refresh_token_expires_at,
        ]
      properties:
        token_type:
          type: string
          const: Bearer
        access_token:
          type: string
          readOnly: true
        access_token_expires_at:
          $ref: "#/components/schemas/Timestamp"
          description: No later than 24 hours after access token issuance. Refreshing must respect the server
            session policy.
        refresh_token:
          type: string
          readOnly: true
        refresh_token_expires_at:
          $ref: "#/components/schemas/Timestamp"
          description: Never later than initial_login_at plus configured session_max_minutes. Rotation never
            extends the absolute session deadline.
      description: Returned only over TLS on successful login/refresh. Never log tokens or include them in
        URLs, audit snapshots, notifications or SSE.
    UserAttributes:
      type: object
      additionalProperties: false
      required:
        [
          full_name,
          email,
          username,
          affiliation,
          status,
          email_verified,
          version,
        ]
      properties:
        full_name:
          type: string
        email:
          type: string
          format: email
        username:
          type: string
        affiliation:
          type: string
        orcid_id:
          type: string
          pattern: '^\d{4}-\d{4}-\d{4}-\d{3}[\dX]$'
        status:
