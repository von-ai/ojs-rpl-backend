    CreateUploadSessionRequest:
      type: object
      additionalProperties: false
      required:
        [
          journal_id,
          resource_type,
          resource_id,
          purpose,
          file_name,
          content_type,
          size,
          checksum_sha256,
        ]
      properties:
        journal_id:
          $ref: "#/components/schemas/Identifier"
        resource_type:
          type: string
          enum:
            - submission
            - revision
            - review
            - copyedit
            - journal
        resource_id:
          $ref: "#/components/schemas/Identifier"
        purpose:
          $ref: "#/components/schemas/FilePurpose"
        file_name:
          type: string
          minLength: 1
          maxLength: 255
        content_type:
          type: string
          enum:
            - application/pdf
            - application/msword
            - application/vnd.openxmlformats-officedocument.wordprocessingml.document
            - text/html
            - application/xml
            - text/xml
            - text/csv
            - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
        size:
          type: integer
          minimum: 1
          maximum: 20971520
        checksum_sha256:
          type: string
          pattern: "^[a-fA-F0-9]{64}$"
        mode:
          $ref: "#/components/schemas/UploadMode"
          default: single
      description: Purpose determines parent type and permitted MIME. Galley uploads use the existing
        submission before a galley record exists; reviewer annotations use the existing assignment as
        resource_id (resource_type=review); imports use journal_id as resource_id. Check parent ownership,
        journal and role per purpose. Only the Journal Manager uploads imports, only the Editor in Chief
        uploads ethics evidence. Reject unsupported multipart mode with 409.
      allOf:
        - if:
            properties:
              purpose:
                enum:
                  - primary_manuscript
                  - supplementary_file
            required:
              - purpose
            type: object
            additionalProperties: true
          then:
            properties:
              resource_type:
                const: submission
              content_type:
                enum:
                  - application/pdf
                  - application/msword
                  - application/vnd.openxmlformats-officedocument.wordprocessingml.document
            type: object
            additionalProperties: true
        - if:
            properties:
              purpose:
                enum:
                  - revision_manuscript
                  - response_letter
            required:
              - purpose
            type: object
            additionalProperties: true
          then:
            properties:
              resource_type:
                const: revision
              content_type:
                enum:
                  - application/pdf
                  - application/msword
                  - application/vnd.openxmlformats-officedocument.wordprocessingml.document
            type: object
            additionalProperties: true
        - if:
            properties:
              purpose:
                enum:
                  - reviewer_annotation
            required:
              - purpose
            type: object
            additionalProperties: true
          then:
            properties:
              resource_type:
                const: review
              content_type:
                enum:
                  - application/pdf
                  - application/msword
                  - application/vnd.openxmlformats-officedocument.wordprocessingml.document
            type: object
            additionalProperties: true
        - if:
            properties:
              purpose:
                enum:
                  - copyedited_manuscript
            required:
              - purpose
            type: object
            additionalProperties: true
          then:
            properties:
              resource_type:
                const: copyedit
              content_type:
                enum:
                  - application/pdf
                  - application/msword
                  - application/vnd.openxmlformats-officedocument.wordprocessingml.document
            type: object
            additionalProperties: true
        - if:
            properties:
              purpose:
                enum:
                  - galley_draft
                  - galley_final
            required:
              - purpose
            type: object
            additionalProperties: true
          then:
            properties:
              resource_type:
                const: submission
              content_type:
                enum:
                  - application/pdf
                  - text/html
                  - application/xml
                  - text/xml
            type: object
            additionalProperties: true
        - if:
            properties:
              purpose:
                enum:
                  - user_import
            required:
              - purpose
            type: object
            additionalProperties: true
          then:
            properties:
              resource_type:
                const: journal
              content_type:
                enum:
                  - text/csv
                  - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
            type: object
            additionalProperties: true
        - if:
            properties:
              purpose:
                enum:
                  - ethics_evidence
            required:
              - purpose
            type: object
            additionalProperties: true
          then:
            properties:
              resource_type:
                const: submission
              content_type:
                enum:
                  - application/pdf
                  - application/msword
                  - application/vnd.openxmlformats-officedocument.wordprocessingml.document
            type: object
            additionalProperties: true
