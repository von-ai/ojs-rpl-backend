        sequence:
          type: integer
          minimum: 1
        corresponding:
          type: boolean
      description: Public contributor metadata. Contact email and internal identity keys are private and
        must never be copied from submission contributors into this projection.

paths:
  /health/live:
    get:
      tags: [Health]
      operationId: getLiveness
      summary: Check whether the API process is alive
      security: []
      x-required-roles: [public]
      responses:
        "200":
          description: API process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"

  /health/ready:
    get:
      tags: [Health]
      operationId: getReadiness
      summary: Check whether required dependencies are ready
      description: Returns only safe dependency categories and never exposes credentials or internal hosts.
      security: []
      x-required-roles: [public]
      responses:
        "200":
          description: API is ready to serve traffic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
        "503":
          description: API is alive but a required dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"

  /api/v1/auth/register:
    post:
      tags: [Authentication]
      operationId: registerUser
      summary: Register a user account
      description: Creates a pending account and queues a single-use verification email valid for 24
        hours. Verification activates default Reader/Author access. A reviewer application is pending
        Journal Manager approval in journal_id and never grants privileged roles.
      security: []
      x-use-cases: [UC-01]
      x-required-roles: [public]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            examples:
              author:
                value:
                  full_name: Benediktus Gianto Jarod
                  email: author@example.org
                  username: benediktus
                  password: StrongPassword123!
                  affiliation: Universitas Hasanuddin
                  requested_role: author
      responses:
        "201":
          description: Account created; email verification is pending.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/journals/{journal_id}/submissions:
    parameters:
      - $ref: "#/components/parameters/JournalId"
    get:
      tags: [Submissions]
      operationId: listSubmissions
      summary: List submissions visible to the current actor
      x-use-cases: [UC-05, UC-06, UC-10]
      x-required-roles:
        [
          author,
          section_editor,
          editor_in_chief,
          copy_editor,
          layout_editor,
          proofreader,
          journal_manager,
        ]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - $ref: "#/components/parameters/SearchQuery"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/SubmissionStatus"
        - name: stage
          in: query
          schema:
            $ref: "#/components/schemas/SubmissionStage"
        - name: section_id
          in: query
          schema:
            $ref: "#/components/schemas/Identifier"
        - name: assigned_editor_id
          in: query
          schema:
            $ref: "#/components/schemas/Identifier"
        - name: author_id
          in: query
          schema:
            $ref: "#/components/schemas/Identifier"
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
        - name: sort
          in: query
          schema:
            type: string
            enum:
              [created_at, -created_at, updated_at, -updated_at, title, -title]
            default: -updated_at
      responses:
        "200":
          description: Role-filtered submissions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionListResponse"
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Submissions]
      operationId: createSubmission
      summary: Create a draft submission
      x-use-cases: [UC-05]
      x-required-roles: [author]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSubmissionRequest"
      responses:
        "201":
          description: Draft submission created.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/journals/{journal_id}/submissions/{submission_id}:
    parameters:
      - $ref: "#/components/parameters/JournalId"
      - $ref: "#/components/parameters/SubmissionId"
    get:
      tags: [Submissions]
      operationId: getSubmission
      summary: Get role-aware submission details
      description: Private author/editor/production representation. Reviewers use their invitation and
        workspace endpoints; this schema contains author identities and is never returned through reviewer
        authorization. Authors see only their own submission; staff require a relevant assignment or
        journal-level management permission.
      x-use-cases: [UC-05, UC-06]
      x-required-roles:
        - author
        - section_editor
        - editor_in_chief
        - copy_editor
        - layout_editor
        - proofreader
        - journal_manager
      responses:
        "200":
          description: Role-aware submission details.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [Submissions]
      operationId: updateSubmission
      summary: Update mutable submission metadata
      x-use-cases: [UC-05]
      x-required-roles: [author]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/UpdateSubmissionRequest"
      responses:
        "200":
          description: Submission updated.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
      x-concurrency-resource: /api/v1/journals/{journal_id}/submissions/{submission_id}

  /api/v1/journals/{journal_id}/submissions/{submission_id}/contributors:
