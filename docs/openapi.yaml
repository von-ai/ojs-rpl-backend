  /oai:
    get:
      tags: [OAI-PMH]
      operationId: handleOaiPmhRequest
      summary: OAI-PMH 2.0 metadata harvesting endpoint
      description: Supports Identify, ListMetadataFormats, ListSets, GetRecord, ListIdentifiers, and
        ListRecords with at least oai_dc. Supports both GET and form-encoded POST. Validate verb-specific
        arguments, date granularity/range and exclusive resumptionToken use. Invalid
        verbs/arguments/prefixes/tokens produce OAI-PMH XML error elements with HTTP 200, never JSON
        validation errors. Only published metadata is harvested.
      security: []
      x-use-cases: [UC-15, UC-17]
      x-required-roles: [public]
      parameters:
        - name: verb
          in: query
          required: true
          schema:
            type: string
            enum:
              [
                Identify,
                ListMetadataFormats,
                ListSets,
                GetRecord,
                ListIdentifiers,
                ListRecords,
              ]
        - name: identifier
          in: query
          schema:
            type: string
        - name: metadataPrefix
          in: query
          schema:
            type: string
            enum: [oai_dc]
        - name: from
          in: query
          schema:
            type: string
        - name: until
          in: query
          schema:
            type: string
        - name: set
          in: query
          schema:
            type: string
        - name: resumptionToken
          in: query
          schema:
            type: string
      responses:
        "200":
          description: OAI-PMH XML response, including protocol errors.
          content:
            application/xml:
              schema:
                type: string
              example: |-
                <?xml version="1.0" encoding="UTF-8"?>
                <OAI-PMH xmlns="http://www.openarchives.org/OAI/2.0/">
                  <responseDate>2026-09-17T09:30:00Z</responseDate>
                  <request verb="Identify">https://api.jurnal-brida.example/oai</request>
                  <Identify>
                    <repositoryName>BRIDA Scientific Journal Repository</repositoryName>
                    <baseURL>https://api.jurnal-brida.example/oai</baseURL>
                    <protocolVersion>2.0</protocolVersion>
                    <adminEmail>journal@example.org</adminEmail>
                    <earliestDatestamp>2026-01-01T00:00:00Z</earliestDatestamp>
                    <deletedRecord>persistent</deletedRecord>
                    <granularity>YYYY-MM-DDThh:mm:ssZ</granularity>
                  </Identify>
                </OAI-PMH>
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
        "429":
          $ref: "#/components/responses/RateLimited"
    post:
      tags:
        - OAI-PMH
      operationId: handleOaiPmhPostRequest
      summary: Harvest metadata using an OAI-PMH form POST
      description: Supports Identify, ListMetadataFormats, ListSets, GetRecord, ListIdentifiers, and
        ListRecords with at least oai_dc. Supports both GET and form-encoded POST. Validate
        verb-specific arguments, date granularity/range and exclusive resumptionToken use. Invalid
        verbs/arguments/prefixes/tokens produce OAI-PMH XML error elements with HTTP 200, never JSON
        validation errors. Only published metadata is harvested.
      security: []
      x-use-cases:
        - UC-15
        - UC-17
      x-required-roles:
        - public
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/OaiPmhRequest"
      responses:
        "200":
          description: OAI-PMH XML response, including protocol errors.
          content:
            application/xml:
              schema:
                type: string
              example: |-
                <?xml version="1.0" encoding="UTF-8"?>
                <OAI-PMH xmlns="http://www.openarchives.org/OAI/2.0/">
                  <responseDate>2026-09-17T09:30:00Z</responseDate>
                  <request verb="Identify">https://api.jurnal-brida.example/oai</request>
                  <Identify>
                    <repositoryName>BRIDA Scientific Journal Repository</repositoryName>
                    <baseURL>https://api.jurnal-brida.example/oai</baseURL>
                    <protocolVersion>2.0</protocolVersion>
                    <adminEmail>journal@example.org</adminEmail>
                    <earliestDatestamp>2026-01-01T00:00:00Z</earliestDatestamp>
                    <deletedRecord>persistent</deletedRecord>
                    <granularity>YYYY-MM-DDThh:mm:ssZ</granularity>
                  </Identify>
                </OAI-PMH>
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
        "429":
          $ref: "#/components/responses/RateLimited"
