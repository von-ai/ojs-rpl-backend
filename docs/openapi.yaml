  /api/v1/auth/orcid/callback:
    get:
      tags: [ORCID]
      operationId: handleOrcidCallback
      summary: Complete ORCID authorization-code flow
      security: []
      x-use-cases: [UC-01, UC-02]
      x-required-roles: [public]
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: error
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 200
      responses:
        "302":
          description: Redirect to the configured frontend completion page.
          headers:
            Location:
              description: Frontend callback location without OAuth secrets.
              schema:
                type: string
                format: uri
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
      description: Require valid, single-use state bound to the initiating account/session and exactly one
        of code or error. On denial consume state and redirect safely without linking an identity. On
        success exchange code server-side, verify provider/environment and bind the authenticated ORCID
        iD; reject an iD already linked elsewhere. Never trust a manually entered ORCID as verified and
        never put tokens in redirect URLs.
      x-implementation-status: planned
      x-non-functional-requirements:
