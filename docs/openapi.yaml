    CreateUploadSessionRequest:
      type: object
      additionalProperties: false
      required:
        [
          journal_id,
          resource_type,
          resource_id,
          purpose,
          file_name,
          content_type,
          size,
          checksum_sha256,
        ]
      properties:
        journal_id:
          $ref: "#/components/schemas/Identifier"
        resource_type:
          type: string
          enum:
            - submission
            - revision
            - review
            - copyedit
            - galley
            - journal
        resource_id:
          $ref: "#/components/schemas/Identifier"
        purpose:
          $ref: "#/components/schemas/FilePurpose"
        file_name:
          type: string
          minLength: 1
          maxLength: 255
        content_type:
          type: string
          enum:
            - application/pdf
            - application/msword
            - application/vnd.openxmlformats-officedocument.wordprocessingml.document
            - text/html
            - application/xml
            - text/xml
            - text/csv
            - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
        size:
          type: integer
          minimum: 1
          maximum: 20971520
        checksum_sha256:
          type: string
          pattern: "^[a-fA-F0-9]{64}$"
      description: For purpose=user_import, resource_type must be journal and resource_id must equal
        journal_id; this avoids requiring an import ID before its input file exists. Only a Journal
        Manager of that journal may upload import files. CSV/XLSX are allowed only for imports;
        primary/revision manuscripts accept PDF/DOC/DOCX; galley MIME must match its format. Server checks
        ownership, purpose, actual MIME, size, checksum and scan status.
      allOf:
        - if:
            properties:
              purpose:
                const: user_import
            required:
              - purpose
          then:
            properties:
              resource_type:
                const: journal
              content_type:
                enum:
                  - text/csv
                  - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
    CompleteUploadRequest:
      type: object
      additionalProperties: false
      required: [etag]
      properties:
        etag:
          type: string
