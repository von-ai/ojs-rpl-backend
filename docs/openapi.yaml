                  $ref: "#/components/schemas/UploadMode"
                status:
                  type: string
                  enum:
                    - pending_upload
                    - uploading
                    - completed
                    - aborted
                    - expired
                version:
                  type: integer
                  minimum: 1
                part_size:
                  type: integer
                  const: 5242880
                uploaded_parts:
                  type: array
                  items:
                    $ref: "#/components/schemas/UploadPart"
                  maxItems: 4
                size:
                  type: integer
                  minimum: 1
                  maximum: 20971520
                checksum_sha256:
                  $ref: "#/components/schemas/Checksum"
                content_type:
                  type: string
                  maxLength: 150
                file_name:
                  type: string
                  maxLength: 255
              allOf:
                - if:
                    properties:
                      mode:
                        const: single
                      status:
                        enum:
                          - pending_upload
                          - uploading
                    required:
                      - mode
                      - status
                    type: object
                    additionalProperties: true
                  then:
                    required:
                      - method
                      - upload_url
                      - required_headers
                    properties:
                      method:
                        type: string
                        const: PUT
                      upload_url:
                        type: string
                        format: uri
                      required_headers:
                        type: object
                        additionalProperties:
                          type: string
                    type: object
                    additionalProperties: true
                - if:
                    properties:
                      mode:
                        const: multipart
                    required:
                      - mode
                    type: object
                    additionalProperties: true
                  then:
                    required:
                      - part_size
                      - uploaded_parts
                    properties:
                      part_size:
                        type: integer
                        const: 5242880
                      uploaded_parts:
                        type: array
                        items:
                          $ref: "#/components/schemas/UploadPart"
                        maxItems: 4
                    type: object
                    additionalProperties: true
                - if:
                    type: object
                    properties:
                      status:
                        enum:
                          - completed
                          - aborted
                          - expired
                    required:
                      - status
                    additionalProperties: true
                  then:
                    type: object
                    properties:
                      upload_url: false
                      required_headers: false
                    additionalProperties: true
        meta:
          $ref: "#/components/schemas/ResourceMeta"
