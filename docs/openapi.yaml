          type: string
          minLength: 1
          maxLength: 100000
        reviewer_guidelines:
          type: string
          minLength: 1
          maxLength: 100000
        revision_grace_days:
          oneOf:
            - type: integer
              minimum: 0
              maximum: 365
            - type: "null"
        auto_withdraw_overdue_revisions:
          type: boolean
          description: Baseline disabled. Enabling requires non-null grace days in the resulting stored
            configuration; never infer a grace duration.
        author_similarity_check_enabled:
          type: boolean
      description: Policy values are explicit deployment settings; day counts prefill future
        invitations/revisions only and never move existing deadlines. Automatic revision withdrawal
        defaults disabled and enabling it requires a non-null revision_grace_days. Validate full merged
        settings on PATCH.
      allOf:
        - if:
            type: object
            properties:
              auto_withdraw_overdue_revisions:
                const: true
            required:
              - auto_withdraw_overdue_revisions
            additionalProperties: true
          then:
            type: object
            required:
              - revision_grace_days
            properties:
              revision_grace_days:
                type: integer
                minimum: 0
                maximum: 365
            additionalProperties: true
